name: CI

on:
  push:
    branches: [main] # every push to main
  pull_request: # every pull request

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint # code style and common mistakes
      - run: npm run build # also checks TypeScript types
